apiVersion: v1
kind: Pod
metadata:
  name: tasks
  labels:
    app: tasks
spec:
  containers:
    - name: api
      image: tasks:dev
      ports:
        - containerPort: 8000
      env:
        - name: DATA_DIR
          value: /data
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      emptyDir: {}
